<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#006241" />
    <script>
      (function () {
        var preference = "system";
        try {
          var saved = window.localStorage.getItem("sb-ph-theme-preference");
          if (saved === "light" || saved === "dark" || saved === "system") preference = saved;
        } catch (error) {
          // Fall back to the device appearance when storage is unavailable.
        }
        var systemDark = false;
        try {
          systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (error) {
          systemDark = false;
        }
        var theme = preference === "system" ? (systemDark ? "dark" : "light") : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = theme;
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.content = theme === "dark" ? "#111813" : "#006241";
      })();
    </script>
    <meta name="description" content="Browse Starbucks Philippines menu, merchandise, Rewards, promotions, and stores." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Starbucks PH" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/app-icon-192.png" />
    <title>Home | Starbucks Coffee Company</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
